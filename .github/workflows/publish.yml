name: Publish CLI

# E2E-G1/G1A/G2/G3/G4 (ICON-E2E-0907) + P0-5/P0-6.
#   1. push to protected `main` when shipped bytes (payloadHash) changed;
#   2. verified moe-icons-code-library-release machine event (resource pin).
# One immutable `npm pack` candidate is produced ONCE on the version-frozen
# release commit and uploaded as an Actions artifact. clitest acceptance,
# npm publish and the GitHub Release all download that same artifact; no job
# re-packs. x/y are human-owned; automation only ever increments patch z.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clitest_sha:
        description: "Full commit SHA of moe-icons-clitest to accept against (default: repo variable CLITEST_REF)"
        required: false
      code_library_sha:
        description: "Full commit SHA of moe-icons-code-library to accept against (default: repo variable CODE_LIBRARY_REF)"
        required: false
      dry_run:
        description: "R-P0-2: manual runs are dry-run unless dry_run=false AND break_glass=PUBLISH"
        required: false
        default: "true"
        type: string
      break_glass:
        description: "Type PUBLISH to allow a manual write (requires kill switch true)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: cli-auto-release
  cancel-in-progress: false

jobs:
  # R-P0-2: a manual dry-run still validates the tree but performs zero writes.
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate without publishing
        run: |
          set -euo pipefail
          npm ci
          npm run policy:verify-remote
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm pack --dry-run --json > "$RUNNER_TEMP/pack-dry-run.json"
          echo "dry-run validation complete; no tag/Release/npm write"

  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      next_version: ${{ steps.decide.outputs.next_version }}
      payload_hash: ${{ steps.decide.outputs.payload_hash }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # R-P0-2: manual dispatch cannot bypass the kill switch. A write run
      # requires the global switch AND an explicit break-glass confirmation.
      - name: Check auto-release switch (F6/R-P0-2)
        id: switch
        env:
          MOEICONS_AUTO_RELEASE_ENABLED: ${{ vars.MOEICONS_AUTO_RELEASE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          BREAK_GLASS: ${{ inputs.break_glass }}
        run: |
          if [ "$MOEICONS_AUTO_RELEASE_ENABLED" != "true" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$DRY_RUN" != "false" ] || [ "$BREAK_GLASS" != "PUBLISH" ]; }; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute payload hash and next patch
        id: decide
        if: steps.switch.outputs.blocked == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-bump.mjs > "$RUNNER_TEMP/bump.json"
          # R-P0-3 anti-recursion: a forged human commit with the same message
          # must NOT be skipped. Require marker + bot actor + only package*.json.
          GUARD="$(node scripts/release-commit.mjs guard --sha "$GITHUB_SHA" --actor "$GITHUB_ACTOR")"
          if [ "$(node -p "JSON.parse(process.argv[1]).skip" "$GUARD")" = "true" ]; then
            echo "bot release commit already handled; CI only" >&2
            echo "should_release=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HASH="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).payloadHash)" "$RUNNER_TEMP/bump.json")"
          NEXT="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).nextVersion)" "$RUNNER_TEMP/bump.json")"
          LAST="$(gh release view "$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo v0.0.0)" --json body --jq .body 2>/dev/null | grep -o 'payloadHash: [a-f0-9]*' | awk '{print $2}' || true)"
          if [ -n "$LAST" ] && [ "$LAST" = "$HASH" ]; then
            echo "payload unchanged; CI only" >&2
            echo "should_release=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=1" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "payload_hash=$HASH" >> "$GITHUB_OUTPUT"

  # P0-5: freeze the version and pack exactly once.
  pack:
    needs: decide
    if: needs.decide.outputs.should_release == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      candidate_sha: ${{ steps.pack.outputs.candidate_sha }}
      release_tag: ${{ steps.bump.outputs.release_tag }}
      cli_commit: ${{ steps.bump.outputs.cli_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # R-P0-3: recover an existing release commit, or freeze+commit LOCALLY.
      # The push happens only after the candidate builds/tests/packs.
      - name: Recover or create the frozen release commit
        id: bump
        env:
          NEXT_VERSION: ${{ needs.decide.outputs.next_version }}
          PAYLOAD_HASH: ${{ needs.decide.outputs.payload_hash }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          EXISTING="$(node scripts/release-commit.mjs find --payload-hash "$PAYLOAD_HASH" --source-commit "$SOURCE_COMMIT")"
          if [ "$EXISTING" != "null" ]; then
            SHA="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).sha)" "$EXISTING")"
            git checkout --detach "$SHA"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "reusing release commit $SHA"
          else
            node -e "
              const fs=require('fs');
              const p=require('./package.json');
              const l=require('./package-lock.json');
              p.version=process.argv[1];
              l.version=process.argv[1];
              if (l.packages && l.packages['']) l.packages[''].version=process.argv[1];
              fs.writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n');
              fs.writeFileSync('./package-lock.json', JSON.stringify(l,null,2)+'\n');
            " "$NEXT_VERSION"
            git config user.name "moe-icons-release-bot"
            git config user.email "moe-icons-release-bot@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): cli v$NEXT_VERSION [source ${SOURCE_COMMIT:0:7}]"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cli_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build, test and pack the immutable candidate once (G2)
        id: pack
        run: |
          set -euo pipefail
          npm ci
          npm run policy:verify-remote
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm audit --audit-level=high --omit=dev || true
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --pack-destination "$RUNNER_TEMP/candidate" --json > "$RUNNER_TEMP/pack.json"
          tgz="$(node -e "const a=require('$RUNNER_TEMP/pack.json');process.stdout.write(a[0].filename)")"
          sha="$(shasum -a 256 "$RUNNER_TEMP/candidate/$tgz" | awk '{print $1}')"
          echo "tgz=$RUNNER_TEMP/candidate/$tgz" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$sha" >> "$GITHUB_OUTPUT"
      # R-P0-3: only now, after the candidate is verified, push the release
      # commit. A build failure therefore leaves main untouched.
      - name: Push the verified release commit
        if: steps.bump.outputs.reused != 'true'
        run: git push origin HEAD:main

      # R-P0-4: record a checksum manifest and SBOM beside the candidate.
      - name: Generate candidate manifest and SBOM
        id: manifest
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/sbom.json" 2>/dev/null || echo '{"bomFormat":"CycloneDX","components":[]}' > "$RUNNER_TEMP/sbom.json"
          node -e '
            const fs=require("fs");
            const {execFileSync}=require("child_process");
            const tgz=process.argv[1];
            const sha=process.argv[2];
            const version=process.argv[3];
            const files=execFileSync("tar",["-tzf",tgz],{encoding:"utf8"}).trim().split(/\r?\n/).filter(Boolean);
            fs.writeFileSync(process.argv[4], JSON.stringify({ schemaVersion:1, version, tgz, sha256:sha, files }, null, 2)+"\n");
          ' "${{ steps.pack.outputs.tgz }}" "${{ steps.pack.outputs.candidate_sha }}" "${{ needs.decide.outputs.next_version }}" "$RUNNER_TEMP/candidate-manifest.json"
      - name: Upload the immutable candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-candidate-${{ needs.decide.outputs.next_version }}
          path: |
            ${{ steps.pack.outputs.tgz }}
            ${{ runner.temp }}/candidate-manifest.json
            ${{ runner.temp }}/sbom.json
          if-no-files-found: error
          retention-days: 14

  acceptance:
    needs: [decide, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      candidate_sha: ${{ needs.pack.outputs.candidate_sha }}
    steps:
      - name: Resolve pinned acceptance refs
        id: resolve
        env:
          CLITEST_REF: ${{ vars.CLITEST_REF }}
          CODE_LIBRARY_REF: ${{ vars.CODE_LIBRARY_REF }}
          INPUT_CLITEST_SHA: ${{ inputs.clitest_sha }}
          INPUT_CODE_LIBRARY_SHA: ${{ inputs.code_library_sha }}
        run: |
          clitest_ref="${INPUT_CLITEST_SHA:-${CLITEST_REF:-}}"
          code_library_ref="${INPUT_CODE_LIBRARY_SHA:-${CODE_LIBRARY_REF:-}}"
          : "${clitest_ref:?set CLITEST_REF (full commit SHA) or clitest_sha input}"
          : "${code_library_ref:?set CODE_LIBRARY_REF (full commit SHA) or code_library_sha input}"
          for ref in "$clitest_ref" "$code_library_ref"; do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "ref must be 40-hex: $ref" >&2; exit 1; }
          done
          echo "clitest_sha=$clitest_ref" >> "$GITHUB_OUTPUT"
          echo "code_library_sha=$code_library_ref" >> "$GITHUB_OUTPUT"
          echo "clitest_sha=$clitest_ref" >> "$GITHUB_ENV"
          echo "code_library_sha=$code_library_ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: moewolf-dev/moe-icons-clitest
          ref: ${{ env.clitest_sha }}
          token: ${{ secrets.CLITEST_READ_TOKEN }}
          path: clitest
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: moewolf-dev/moe-icons-code-library
          ref: ${{ env.code_library_sha }}
          token: ${{ secrets.CODE_LIBRARY_READ_TOKEN }}
          path: code-library
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # P0-5: consume the exact artifact produced by the pack job.
      - name: Download the immutable candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-candidate-${{ needs.decide.outputs.next_version }}
          path: clitest/.artifacts
      - name: Verify the downloaded candidate identity
        env:
          EXPECTED_SHA: ${{ needs.pack.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          tgz="$(ls clitest/.artifacts/*.tgz)"
          actual="$(shasum -a 256 "$tgz" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA" || { echo "candidate sha mismatch" >&2; exit 1; }
          echo "candidate_sha=$actual"
      - name: Install clitest
        working-directory: clitest
        run: npm ci
      - name: Build code-library candidate
        working-directory: code-library
        env:
          MOE_ICONS_SOURCE_DIR: tests/fixtures/icon-source
          MOE_ICONS_FREE_STYLE_GROUPS: moe-colored,moe-lite-outline,moe-outline,moe-solid
        run: |
          npm ci
          npm run clean && npm run generate && npm run build:free && npm run build:pro && npm run build:ent && npm run build:main && npm run postbuild
      - name: Acceptance gates (G3)
        working-directory: clitest
        env:
          MOEICONS_CODE_LIBRARY_REPO: ../code-library
        run: |
          node scripts/prime-candidate-cache.mjs
          npm run test:package
          npm run test:sandbox
      - name: Record acceptance evidence
        run: |
          echo "## CLI acceptance (G3)" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate sha: \`${{ needs.pack.outputs.candidate_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cli commit: \`${{ needs.pack.outputs.cli_commit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- release tag: \`${{ needs.pack.outputs.release_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # P0-6: draft -> upload+readback -> npm (publish or verify) -> finalize.
  publish:
    needs: [decide, pack, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the same immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-candidate-${{ needs.decide.outputs.next_version }}
          path: candidate
      - name: Verify candidate identity
        env:
          EXPECTED_SHA: ${{ needs.pack.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          tgz="$(ls candidate/*.tgz)"
          actual="$(shasum -a 256 "$tgz" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA" || { echo "candidate sha mismatch" >&2; exit 1; }
          echo "tgz=$tgz" >> "$GITHUB_ENV"
      - name: Create or reuse draft Release and upload the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pack.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.pack.outputs.candidate_sha }}
          PAYLOAD_HASH: ${{ needs.decide.outputs.payload_hash }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            test "$is_draft" = "true" || { echo "$TAG is already published" >&2; exit 1; }
          else
            # R-P0-4: the tag must point at the frozen release commit.
            gh release create "$TAG" --draft --target "${{ needs.pack.outputs.cli_commit }}" --title "$TAG" --notes "sha256: $EXPECTED_SHA\npayloadHash: $PAYLOAD_HASH"
          fi
          # Verify the tag target even on rerun.
          target="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          test "$target" = "${{ needs.pack.outputs.cli_commit }}" || { echo "tag $TAG target $target != ${cli_commit}" >&2; exit 1; }
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '\.tgz$'; then
            gh release upload "$TAG" "$tgz"
          fi
          mkdir -p verify
          gh release download "$TAG" --pattern '*.tgz' --dir verify --clobber
          actual="$(shasum -a 256 verify/*.tgz | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA" || { echo "draft asset digest mismatch" >&2; exit 1; }
      # SEC-A2-05: npm OIDC Trusted Publishing only. No NPM_TOKEN /
      # NODE_AUTH_TOKEN fallback exists; `id-token: write` + the protected
      # `npm-publish` environment + `--provenance` are the only auth path.
      - name: Publish to npm or verify the existing registry package
        env:
          TAG: ${{ needs.pack.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.pack.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if npm view "@moewolf/moe-icons-cli@${version}" version >/dev/null 2>&1; then
            echo "npm version already exists; verifying registry CONTENT matches the candidate"
            mkdir -p registry candidate-extract registry-extract
            npm pack "@moewolf/moe-icons-cli@${version}" --pack-destination registry --silent >/dev/null
            tar -xzf "$tgz" -C candidate-extract
            tar -xzf registry/*.tgz -C registry-extract
            (cd candidate-extract && find . -type f | sort | xargs shasum -a 256) > candidate-digests
            (cd registry-extract && find . -type f | sort | xargs shasum -a 256) > registry-digests
            diff -u candidate-digests registry-digests || { echo "registry content differs from candidate" >&2; exit 1; }
            integrity="$(npm view "@moewolf/moe-icons-cli@${version}" dist.integrity)"
            echo "registry integrity: $integrity"
          else
            npm publish "$tgz" --access public --provenance
          fi
      - name: Smoke npx install
        run: |
          set -euo pipefail
          version="${{ needs.pack.outputs.release_tag }}"
          version="${version#v}"
          npx --yes "@moewolf/moe-icons-cli@${version}" --version
      - name: Finalize the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pack.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json isDraft,tagName,url
