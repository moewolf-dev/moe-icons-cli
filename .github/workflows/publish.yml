name: Publish CLI
run-name: Publish CLI ${{ inputs.correlation_id != '' && inputs.correlation_id || (inputs.resume_run_id != '' && format('resume:{0}', inputs.resume_run_id)) || github.sha }}

# E2E-G1/G1A/G2/G3/G4 (ICON-E2E-0907) + P0-5/P0-6.
#   1. push to protected `main` when shipped bytes (payloadHash) changed;
#   2. verified moe-icons-code-library-release machine event (resource pin).
# One immutable `npm pack` candidate is produced ONCE on the version-frozen
# release commit and uploaded as an Actions artifact. clitest acceptance,
# npm publish and the GitHub Release all download that same artifact; no job
# re-packs. x/y are human-owned; automation only ever increments patch z.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_auth_mode:
        description: "Explicit authorized authentication mode using existing repository NPM_TOKEN"
        type: choice
        options: [oidc, token]
        default: oidc
      auth_audit_only:
        description: "Inspect npm trusted publisher metadata with the existing token; do not run validation or publish"
        type: boolean
        default: false
      resume_run_id:
        description: "Recover an already accepted immutable candidate from this repository run; never rebuild or bump"
        required: false
        type: string
      correlation_id:
        description: "Exact package-set resource event being published"
        required: false
        type: string
      clitest_sha:
        description: "Full commit SHA of moe-icons-clitest to accept against (default: repo variable CLITEST_REF)"
        required: false
      dry_run:
        description: "R-P0-2: manual runs are dry-run unless dry_run=false AND break_glass=PUBLISH"
        required: false
        default: "true"
        type: string
      break_glass:
        description: "Type PUBLISH to allow a manual write (requires kill switch true)"
        required: false
        type: string

permissions: {}

concurrency:
  group: cli-auto-release
  cancel-in-progress: false
  queue: max

jobs:
  npm-auth-preflight:
    environment: npm-publish
    permissions:
      contents: read
    if: github.event_name == 'workflow_dispatch' && inputs.npm_auth_mode == 'token'
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify existing repository publisher token before release work
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_auth_mode == 'token' && secrets.NPM_TOKEN || '' }}
          AUTH_AUDIT_ONLY: ${{ inputs.auth_audit_only }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN"
          npm whoami >/dev/null
          if [ "$AUTH_AUDIT_ONLY" = true ]; then
            # Read-only: expose publisher metadata, never the repository token.
            npm trust list @moewolf/moe-icons-cli --json > "$RUNNER_TEMP/npm-trust.json"
            node - "$RUNNER_TEMP/npm-trust.json" <<'JS'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const entries = Array.isArray(data) ? data : Array.isArray(data.publishers) ? data.publishers : Array.isArray(data.trust) ? data.trust : [];
          const summary = entries.map(entry => ({
            provider: entry.provider ?? entry.type ?? null,
            repository: entry.repository ?? entry.repo ?? null,
            workflow: entry.workflow ?? entry.file ?? entry.workflowFile ?? null,
            environment: entry.environment ?? entry.env ?? null,
            publishAllowed: entry.publishAllowed ?? entry.allowPublish ?? entry.allow_publish ?? null,
          }));
          console.log(JSON.stringify({ publisherCount: entries.length, publishers: summary }));
          JS
          fi
          echo 'Existing npm publisher token authenticated; final publish enforces package permissions.'

  # R-P0-2: a manual dry-run still validates the tree but performs zero writes.
  validate:
    if: github.event_name == 'workflow_dispatch' && inputs.auth_audit_only != true
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - name: Checkout immutable shared contract fixture authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-package-maker
          ref: 26cbe1f04ebb4c29419cd99b9e8a5c3df2a356c2
          path: .tmp/shared-contract-fixture
          persist-credentials: false
      - name: Require shared fixture checks instead of skipping them
        run: echo "MOEICONS_PACKAGE_MAKER_REPO=$GITHUB_WORKSPACE/.tmp/shared-contract-fixture" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Resolve exact config contract authority
        id: config-authority
        run: echo "sha=$(node -p 'require("./src/config-package/generated/SOURCE.json").sourceCommit')" >> "$GITHUB_OUTPUT"
      - name: Checkout exact config contract authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-code-library
          ref: ${{ steps.config-authority.outputs.sha }}
          token: ${{ secrets.CODE_LIBRARY_READ_TOKEN }}
          path: .tmp/config-contract-fixture
          persist-credentials: false
          sparse-checkout: config-package
      - name: Require config authority checks instead of skipping them
        run: |
          test -f .tmp/config-contract-fixture/config-package/src/render-config.cjs
          echo "MOEICONS_CODE_LIBRARY_REPO=$GITHUB_WORKSPACE/.tmp/config-contract-fixture" >> "$GITHUB_ENV"
      - name: Prepare pinned pnpm invocation tool
        run: |
          root="$RUNNER_TEMP/cli-pnpm-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          npm install --prefix "$root" --no-save --no-audit --no-fund pnpm@10.17.1
          echo "$root/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Validate without publishing
        run: |
          set -euo pipefail
          npm ci
          npm run policy:verify-remote
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm pack --dry-run --json > "$RUNNER_TEMP/pack-dry-run.json"
          echo "dry-run validation complete; no tag/Release/npm write"

  decide:
    needs: npm-auth-preflight
    if: always() && inputs.auth_audit_only != true && inputs.resume_run_id == '' && (needs.npm-auth-preflight.result == 'success' || needs.npm-auth-preflight.result == 'skipped')
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      next_version: ${{ steps.decide.outputs.next_version }}
      payload_hash: ${{ steps.decide.outputs.payload_hash }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # R-P0-2: manual dispatch cannot bypass the kill switch. A write run
      # requires the global switch AND an explicit break-glass confirmation.
      - name: Check auto-release switch (F6/R-P0-2)
        id: switch
        env:
          MOEICONS_AUTO_RELEASE_ENABLED: ${{ vars.MOEICONS_AUTO_RELEASE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          BREAK_GLASS: ${{ inputs.break_glass }}
        run: |
          if [ "$MOEICONS_AUTO_RELEASE_ENABLED" != "true" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$DRY_RUN" != "false" ] || [ "$BREAK_GLASS" != "PUBLISH" ]; }; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build shipped files before comparing payload hashes
        if: steps.switch.outputs.blocked == '0'
        run: |
          npm ci
          npm run build
      - name: Compute payload hash and next patch
        id: decide
        if: steps.switch.outputs.blocked == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-bump.mjs > "$RUNNER_TEMP/bump.json"
          HASH="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).payloadHash)" "$RUNNER_TEMP/bump.json")"
          NEXT="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).nextVersion)" "$RUNNER_TEMP/bump.json")"
          echo "payload_hash=$HASH" >> "$GITHUB_OUTPUT"
          # R-P0-3 anti-recursion: a forged human commit with the same message
          # must NOT be skipped. Require marker + bot actor + only package*.json.
          GUARD="$(node scripts/release-commit.mjs guard --sha "$GITHUB_SHA" --actor "$GITHUB_ACTOR")"
          if [ "$(node -p "JSON.parse(process.argv[1]).skip" "$GUARD")" = "true" ]; then
            echo "bot release commit already handled; CI only" >&2
            echo "should_release=0" >> "$GITHUB_OUTPUT"
            echo "reuse_reason=bot-release-commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Recovery stage: look up the publish intent for this exact pin with a
          # bounded retry. A failed lookup must never fall back to allocating a
          # new version; only a confirmed absence may use the payload branch.
          INTENT_STATUS=missing
          INTENT_FILE=""
          for attempt in $(seq 1 3); do
            if artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=cli-publish-intent-${GITHUB_SHA}&per_page=1" 2>/dev/null)"; then
              intent_run="$(node -e 'try{const a=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(String((a.artifacts&&a.artifacts[0]&&a.artifacts[0].workflow_run&&a.artifacts[0].workflow_run.id)||""))}catch{}' <<<"$artifacts")"
              if [ -n "$intent_run" ]; then
                INTENT_STATUS=found
                mkdir -p "$RUNNER_TEMP/intent"
                for download in $(seq 1 3); do
                  gh run download "$intent_run" --repo "$GITHUB_REPOSITORY" --name "cli-publish-intent-${GITHUB_SHA}" --dir "$RUNNER_TEMP/intent" 2>/dev/null && break
                  sleep 10
                done
                INTENT_FILE="$RUNNER_TEMP/intent/cli-publish-intent.json"
                if [ ! -f "$INTENT_FILE" ]; then
                  echo "publish intent artifact could not be downloaded; refusing to continue" >&2
                  exit 1
                fi
              fi
              break
            fi
            if [ "$attempt" = 3 ]; then INTENT_STATUS=failed; break; fi
            sleep 10
          done
          REGISTRY=unknown
          if [ "$INTENT_STATUS" = found ]; then
            RESUME_VERSION="$(node -e 'process.stdout.write(String(require(process.argv[1]).version))' "$INTENT_FILE")"
            for attempt in $(seq 1 3); do
              if npm view "@moewolf/moe-icons-cli@${RESUME_VERSION}" version >/dev/null 2>&1; then REGISTRY=visible; break; fi
              sleep 10
            done
          fi
          LAST="$(gh release view "$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo v0.0.0)" --json body --jq .body 2>/dev/null | grep -o 'payloadHash: [a-f0-9]*' | awk '{print $2}' || true)"
          # One decision, one writer: scripts/release-decision.mjs owns the branch
          # and this shell writes its outputs exactly once.
          DECISION="$(node scripts/release-decision.mjs --intent-status "$INTENT_STATUS" --registry "$REGISTRY" --pin "$GITHUB_SHA" --next "$NEXT" --payload "$HASH" ${INTENT_FILE:+--intent "$INTENT_FILE"} ${LAST:+--last-payload "$LAST"})"
          node -e '
            const d=JSON.parse(process.argv[1]);
            const lines=[`should_release=${d.shouldRelease?1:0}`];
            if(d.nextVersion) lines.push(`next_version=${d.nextVersion}`);
            if(d.resume) lines.push("resume=1");
            if(d.reuseReason) lines.push(`reuse_reason=${d.reuseReason}`);
            process.stdout.write(lines.join("\n")+"\n");
          ' "$DECISION" >> "$GITHUB_OUTPUT"

  recover:
    if: always() && inputs.auth_audit_only != true && github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && needs.validate.result == 'success' && (needs.npm-auth-preflight.result == 'success' || needs.npm-auth-preflight.result == 'skipped')
    needs: [validate, npm-auth-preflight]
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      candidate_sha: ${{ steps.verify.outputs.candidate_sha }}
      cli_commit: ${{ steps.verify.outputs.cli_commit }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
      next_version: ${{ steps.verify.outputs.next_version }}
      payload_hash: ${{ steps.verify.outputs.payload_hash }}
      pin_commit: ${{ steps.verify.outputs.pin_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Authorize exact candidate recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.resume_run_id }}
          RELEASE_ENABLED: ${{ vars.MOEICONS_AUTO_RELEASE_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run }}
          BREAK_GLASS: ${{ inputs.break_glass }}
        run: |
          set -euo pipefail
          test "$RELEASE_ENABLED" = true && test "$DRY_RUN" = false && test "$BREAK_GLASS" = PUBLISH
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] && test "$RUN_ID" != "$GITHUB_RUN_ID"
          mkdir recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > recovery/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" > recovery/jobs.json
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cli-candidate-*' --dir recovery/artifacts
      - name: Verify original acceptance and frozen candidate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.resume_run_id }}
        run: node scripts/recover-candidate.mjs recovery

  # P0-5: freeze the version and pack exactly once.
  pack:
    needs: decide
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.should_release == '1'
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.pack.outputs.candidate_sha }}
      release_tag: ${{ steps.bump.outputs.release_tag }}
      cli_commit: ${{ steps.bump.outputs.cli_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Checkout immutable shared contract fixture authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-package-maker
          ref: 26cbe1f04ebb4c29419cd99b9e8a5c3df2a356c2
          path: .tmp/shared-contract-fixture
          persist-credentials: false
      - name: Require shared fixture checks instead of skipping them
        run: echo "MOEICONS_PACKAGE_MAKER_REPO=$GITHUB_WORKSPACE/.tmp/shared-contract-fixture" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Resolve exact config contract authority
        id: config-authority
        run: echo "sha=$(node -p 'require("./src/config-package/generated/SOURCE.json").sourceCommit')" >> "$GITHUB_OUTPUT"
      - name: Checkout exact config contract authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-code-library
          ref: ${{ steps.config-authority.outputs.sha }}
          token: ${{ secrets.CODE_LIBRARY_READ_TOKEN }}
          path: .tmp/config-contract-fixture
          persist-credentials: false
          sparse-checkout: config-package
      - name: Require config authority checks instead of skipping them
        run: |
          test -f .tmp/config-contract-fixture/config-package/src/render-config.cjs
          echo "MOEICONS_CODE_LIBRARY_REPO=$GITHUB_WORKSPACE/.tmp/config-contract-fixture" >> "$GITHUB_ENV"
      - name: Prepare pinned pnpm invocation tool
        run: |
          root="$RUNNER_TEMP/cli-pnpm-${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          npm install --prefix "$root" --no-save --no-audit --no-fund pnpm@10.17.1
          echo "$root/node_modules/.bin" >> "$GITHUB_PATH"
      # R-P0-3: recover an existing release commit, or freeze+commit LOCALLY.
      # The push happens only after the candidate builds/tests/packs.
      - name: Recover or create the frozen release commit
        id: bump
        env:
          NEXT_VERSION: ${{ needs.decide.outputs.next_version }}
          PAYLOAD_HASH: ${{ needs.decide.outputs.payload_hash }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          EXISTING="$(node scripts/release-commit.mjs find --payload-hash "$PAYLOAD_HASH" --source-commit "$SOURCE_COMMIT")"
          if [ "$EXISTING" != "null" ]; then
            SHA="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).sha)" "$EXISTING")"
            git checkout --detach "$SHA"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "reusing release commit $SHA"
          else
            node -e "
              const fs=require('fs');
              const p=require('./package.json');
              const l=require('./package-lock.json');
              p.version=process.argv[1];
              // R-P0-3/BLOCK-4: record the payload hash IN the release commit so
              // a rerun can find the same frozen commit; payload-hash.mjs
              // excludes this field from the hash to avoid recursion.
              p.payloadHash=process.argv[2];
              l.version=process.argv[1];
              if (l.packages && l.packages['']) l.packages[''].version=process.argv[1];
              fs.writeFileSync('./package.json', JSON.stringify(p,null,2)+'\n');
              fs.writeFileSync('./package-lock.json', JSON.stringify(l,null,2)+'\n');
            " "$NEXT_VERSION" "$PAYLOAD_HASH"
            git config user.name "moe-icons-release-bot"
            git config user.email "moe-icons-release-bot@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): cli v$NEXT_VERSION [source ${SOURCE_COMMIT:0:7}]"
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
          echo "cli_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build, test and pack the immutable candidate once (G2)
        id: pack
        run: |
          set -euo pipefail
          npm ci
          npm run policy:verify-remote
          npm run lint
          npm run typecheck
          npm run build
          npm test
          npm audit --audit-level=high --omit=dev || true
          mkdir -p "$RUNNER_TEMP/candidate"
          npm pack --pack-destination "$RUNNER_TEMP/candidate" --json > "$RUNNER_TEMP/pack.json"
          tgz="$(node -e "const a=require('$RUNNER_TEMP/pack.json');process.stdout.write(a[0].filename)")"
          sha="$(sha256sum "$RUNNER_TEMP/candidate/$tgz" | awk '{print $1}')"
          echo "tgz=$RUNNER_TEMP/candidate/$tgz" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$sha" >> "$GITHUB_OUTPUT"
      # FIX-26-D: scan the actual npm pack tgz for Pro group names/digests before
      # it can be uploaded or published. Failure blocks the release.
      - name: Scan the packed bundle for Pro leakage
        run: |
          set -euo pipefail
          tgz="$(node -e "const a=require('$RUNNER_TEMP/pack.json');process.stdout.write(a[0].filename)")"
          EVIDENCE_ARGS=(--free vendor/moe-icons-release-policy/free-style-groups.v1.json --manifest vendor/moe-icons-release-scan/pro-manifest.json)
          if [ -f src/catalog/resource-release.json ]; then
            EVIDENCE_ARGS+=(--resource-release src/catalog/resource-release.json)
          fi
          if [ -n "${MOE_ICONS_PRO_DESCRIPTOR:-}" ] && [ -f "$MOE_ICONS_PRO_DESCRIPTOR" ]; then
            EVIDENCE_ARGS+=(--descriptor "$MOE_ICONS_PRO_DESCRIPTOR")
          fi
          node scripts/derive-forbid-evidence.mjs "${EVIDENCE_ARGS[@]}" --out "$RUNNER_TEMP/candidate/forbid-evidence.json"
          (cd "$RUNNER_TEMP/candidate" && sha256sum forbid-evidence.json > forbid-evidence.json.sha256)
          node scripts/scan-bundle.mjs \
            --tgz "$RUNNER_TEMP/candidate/$tgz" \
            --forbid-file "$RUNNER_TEMP/candidate/forbid-evidence.json" \
            --forbid-prefix "moe-3d-metal"
      # R-P0-3: only now, after the candidate is verified, push the release
      # commit. A build failure therefore leaves main untouched.
      - name: Push the verified release commit
        if: steps.bump.outputs.reused != 'true'
        run: git push origin HEAD:main

      # R-P0-4: record a checksum manifest and SBOM beside the candidate.
      - name: Generate candidate manifest and SBOM
        id: manifest
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx > "$RUNNER_TEMP/candidate/sbom.json" 2>/dev/null || echo '{"bomFormat":"CycloneDX","components":[]}' > "$RUNNER_TEMP/candidate/sbom.json"
          node -e '
            const fs=require("fs");
            const {execFileSync}=require("child_process");
            const tgz=process.argv[1];
            const sha=process.argv[2];
            const version=process.argv[3];
            const files=execFileSync("tar",["-tzf",tgz],{encoding:"utf8"}).trim().split(/\r?\n/).filter(Boolean);
            fs.writeFileSync(process.argv[4], JSON.stringify({ schemaVersion:1, version, tgz, sha256:sha, files }, null, 2)+"\n");
          ' "${{ steps.pack.outputs.tgz }}" "${{ steps.pack.outputs.candidate_sha }}" "${{ needs.decide.outputs.next_version }}" "$RUNNER_TEMP/candidate/candidate-manifest.json"
      - name: Upload the immutable candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-candidate-${{ needs.decide.outputs.next_version }}
          # AUD-OBS-03: upload the single staging directory so the artifact root
          # is flat (tgz + sidecars at the same level); download keeps that layout.
          path: ${{ runner.temp }}/candidate
          # Recovery uses this exact artifact and must survive the incident
          # window. The repository/org retention ceiling must allow 90 days.
          retention-days: 90
          if-no-files-found: error
  acceptance:
    needs: [decide, pack]
    if: always() && needs.decide.result == 'success' && needs.pack.result == 'success'
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    permissions:
      actions: read
      contents: read
    # Acceptance runs the complete sandbox suite against bounded package-set
    # fixtures and the exact immutable CLI candidate; no library aggregate build.
    timeout-minutes: 90
    outputs:
      candidate_sha: ${{ needs.pack.outputs.candidate_sha }}
    steps:
      # This job also runs .github/scripts, so it must own a checkout of this
      # repository instead of relying on a previous job's workspace leftovers.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Resolve pinned acceptance refs
        id: resolve
        env:
          CLITEST_REF: ${{ vars.CLITEST_REF }}
          INPUT_CLITEST_SHA: ${{ inputs.clitest_sha }}
        run: |
          clitest_ref="${INPUT_CLITEST_SHA:-${CLITEST_REF:-}}"
          : "${clitest_ref:?set CLITEST_REF (full commit SHA) or clitest_sha input}"
          [[ "$clitest_ref" =~ ^[0-9a-f]{40}$ ]] || { echo "clitest ref must be 40-hex: $clitest_ref" >&2; exit 1; }
          echo "clitest_sha=$clitest_ref" >> "$GITHUB_OUTPUT"
          echo "clitest_sha=$clitest_ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: moewolf-dev/moe-icons-clitest
          ref: ${{ env.clitest_sha }}
          token: ${{ secrets.CLITEST_READ_TOKEN }}
          path: clitest
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - name: Checkout the exact CLI source used for the immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.pack.outputs.cli_commit }}
          path: cli
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # P0-5: consume the exact artifact produced by the pack job.
      - name: Download the immutable candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-candidate-${{ needs.decide.outputs.next_version }}
          path: clitest/.artifacts
      - name: Verify the downloaded candidate identity
        env:
          EXPECTED_SHA: ${{ needs.pack.outputs.candidate_sha }}
          EXPECTED_CLI_COMMIT: ${{ needs.pack.outputs.cli_commit }}
        run: |
          set -euo pipefail
          tgz="$(ls clitest/.artifacts/*.tgz)"
          actual="$(shasum -a 256 "$tgz" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA" || { echo "candidate sha mismatch" >&2; exit 1; }
          checkout_commit="$(git -C cli rev-parse HEAD)"
          test "$checkout_commit" = "$EXPECTED_CLI_COMMIT" || { echo "CLI fixture adapter commit mismatch" >&2; exit 1; }
          echo "candidate_sha=$actual"
      - name: Require the native test toolchain before installing clitest
        # clitest depends on node-pty, which has no Linux x64 prebuild and falls
        # back to node-gyp. A runner without make/gcc/g++ fails deep inside npm ci
        # with a misleading message, so fail early and name the host requirement.
        run: |
          set -euo pipefail
          missing=""
          for tool in make gcc g++ python3; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "acceptance runner is missing required native build tools:$missing" >&2
            echo "install build-essential (make, gcc, g++, python3) on this runner" >&2
            exit 1
          fi
          # Print the full version output: piping into `head` makes the producer
          # fail with SIGPIPE under `set -o pipefail` and fails this gate.
          make --version
          gcc --version
          g++ --version
          python3 --version
      - name: Install clitest
        working-directory: clitest
        run: npm ci
      - name: Build the exact CLI package-set fixture adapter
        working-directory: cli
        run: |
          npm ci
          npm run build
      - name: Acceptance gates (G3)
        working-directory: clitest
        env:
          MOEICONS_CLI_REPO: ../cli
        run: |
          node scripts/prime-candidate-cache.mjs
          npm run test:package
          npm run test:sandbox:full
      - name: Record acceptance evidence
        run: |
          echo "## CLI package-set acceptance (G3)" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate sha: \`${{ needs.pack.outputs.candidate_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- cli commit: \`${{ needs.pack.outputs.cli_commit }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- release tag: \`${{ needs.pack.outputs.release_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # P0-6: draft -> upload+readback -> npm (publish or verify) -> finalize.
  # PROVENANCE-HOSTED: `npm publish --provenance` is rejected by the npm registry
  # (HTTP 422, "Unsupported GitHub Actions runner environment: self-hosted"); only
  # GitHub-hosted runners may mint the sigstore provenance bundle. This repository
  # is public, so provenance is permitted. Keep this job on GitHub-hosted even
  # though the build/acceptance jobs stay on the self-hosted runners.
  publish:
    needs: [decide, pack, acceptance, recover]
    if: always() && (needs.acceptance.result == 'success' || needs.recover.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      # FIX-29-B: check out the exact candidate commit so the scanner script is
      # present; the publish job does not otherwise have the source tree.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.recover.outputs.cli_commit || needs.pack.outputs.cli_commit }}
          fetch-depth: 1
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the same immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-candidate-${{ needs.recover.outputs.next_version || needs.decide.outputs.next_version }}
          run-id: ${{ inputs.resume_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify candidate identity
        env:
          EXPECTED_SHA: ${{ needs.recover.outputs.candidate_sha || needs.pack.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          tgz="$(ls candidate/*.tgz)"
          actual="$(shasum -a 256 "$tgz" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA" || { echo "candidate sha mismatch" >&2; exit 1; }
          echo "tgz=$(realpath "$tgz")" >> "$GITHUB_ENV"
      # AUD-BLOCK-46/48: scan with the SAME evidence bytes produced at pack time,
      # after verifying their recorded SHA-256. Prefix scan is only a backstop.
      - name: Verify evidence and scan the published bundle
        env:
          MOEICONS_AUTO_RELEASE_ENABLED: ${{ vars.MOEICONS_AUTO_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          (cd candidate && shasum -a 256 -c forbid-evidence.json.sha256)
          tokens="$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('candidate/forbid-evidence.json','utf8')).tokens.length))")"
          if [ "${MOEICONS_AUTO_RELEASE_ENABLED:-}" = "true" ] && [ "$tokens" = "0" ]; then
            echo "no derived Pro tokens available for a real publish; refusing to publish" >&2
            exit 1
          fi
          node scripts/scan-bundle.mjs --tgz "$tgz" \
            --forbid-file candidate/forbid-evidence.json \
            --forbid-prefix "moe-3d-metal"
      - name: Checkout exact publisher tools for immutable-candidate recovery
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .tmp/publisher-tools
          persist-credentials: false
          sparse-checkout: scripts/ensure-release-tag.mjs
          sparse-checkout-cone-mode: false
      - name: Create or reuse draft Release and upload the candidate
        env:
          # Optional fine-grained token for tagging the frozen release commit.
          # GitHub's create-reference endpoint may require Workflows: write
          # when the target is not the workflow's triggering commit. The
          # repository GITHUB_TOKEN remains the default; this secret is only
          # exposed to this one publish step.
          GH_TOKEN: ${{ secrets.CLI_RELEASE_WRITE_TOKEN || github.token }}
          TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.recover.outputs.candidate_sha || needs.pack.outputs.candidate_sha }}
          CLI_COMMIT: ${{ needs.recover.outputs.cli_commit || needs.pack.outputs.cli_commit }}
          PAYLOAD_HASH: ${{ needs.recover.outputs.payload_hash || needs.decide.outputs.payload_hash }}
        run: |
          set -euo pipefail
          node .tmp/publisher-tools/scripts/ensure-release-tag.mjs
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            test "$is_draft" = "true" || { echo "$TAG is already published" >&2; exit 1; }
          else
            # R-P0-4: the tag must point at the frozen release commit.
            gh release create "$TAG" --draft --target "${{ needs.recover.outputs.cli_commit || needs.pack.outputs.cli_commit }}" --title "$TAG" --notes "sha256: $EXPECTED_SHA\npayloadHash: $PAYLOAD_HASH"
          fi
          # Verify the tag target even on rerun.
          node .tmp/publisher-tools/scripts/ensure-release-tag.mjs
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '\.tgz$'; then
            gh release upload "$TAG" "$tgz"
          fi
          mkdir -p verify
          gh release download "$TAG" --pattern '*.tgz' --dir verify --clobber
          actual="$(shasum -a 256 verify/*.tgz | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA" || { echo "draft asset digest mismatch" >&2; exit 1; }
      # Explicit manual token override retains provenance and all release gates.
      # Recovery stage 1: persist the exact publish intent before any external
      # write. Nothing here reads the registry, so a lagging read path can never
      # block the intent from being durable.
      - name: Record the exact publish intent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.recover.outputs.candidate_sha || needs.pack.outputs.candidate_sha }}
          RELEASE_COMMIT: ${{ needs.recover.outputs.cli_commit || needs.pack.outputs.cli_commit }}
          PIN_COMMIT: ${{ needs.recover.outputs.pin_commit || github.sha }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p intent
          node -e '
            const fs=require("fs");
            const resource=JSON.parse(fs.readFileSync("src/catalog/resource-release.json","utf8"));
            const intent={schemaVersion:1,version:process.argv[1],tag:process.env.RELEASE_TAG,
              candidateSha256:process.argv[2],releaseCommit:process.argv[3],pinCommit:process.env.PIN_COMMIT,
              repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,
              resource:{resourceVersion:resource.resourceVersion,sourceCommit:resource.sourceCommit,
                sourceDispatchId:resource.sourceDispatchId,packageSets:resource.packageSets},
              stage:"publish-intent"};
            fs.writeFileSync("intent/cli-publish-intent.json", JSON.stringify(intent,null,2)+"\n");
          ' "$version" "$CANDIDATE_SHA" "$RELEASE_COMMIT"
          cat intent/cli-publish-intent.json
      - name: Upload the publish intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-publish-intent-${{ needs.recover.outputs.pin_commit || github.sha }}
          path: intent/cli-publish-intent.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to npm or verify the existing registry package
        env:
          AUTH_MODE: ${{ inputs.npm_auth_mode || 'oidc' }}
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_auth_mode == 'token' && secrets.NPM_TOKEN || '' }}
          TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.recover.outputs.candidate_sha || needs.pack.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = token ]; then
            test -n "$NODE_AUTH_TOKEN" || { echo "repository NPM_TOKEN is unavailable" >&2; exit 1; }
            npm whoami >/dev/null
            echo "repository npm token authentication verified; publish enforces package permissions"
          else
            unset NODE_AUTH_TOKEN
            export NPM_CONFIG_USERCONFIG=/dev/null
          fi
          version="${TAG#v}"
          lifecycle=absent
          if [ "$AUTH_MODE" = token ]; then
            lifecycle="$(VERSION="$version" node --input-type=module -e '
              const r=await fetch(`https://registry.npmjs.org/-/package/@moewolf%2fmoe-icons-cli/version/${process.env.VERSION}/status`,{headers:{Authorization:`Bearer ${process.env.NODE_AUTH_TOKEN}`}});
              if(r.status===404||r.status===403){console.log("absent");}else if(r.ok){const j=await r.json();console.log(j.status);}else{console.error(`npm lifecycle HTTP ${r.status}`);process.exit(1);}
            ')"
            echo "npm version lifecycle: $lifecycle"
          fi
          if [ "$lifecycle" != absent ] && [ "$lifecycle" != published ]; then
            echo "Existing npm submission: $lifecycle; do not resubmit the immutable version"
          elif npm view "@moewolf/moe-icons-cli@${version}" version >/dev/null 2>&1; then
            echo "npm version already exists; verifying registry CONTENT matches the candidate"
            mkdir -p registry candidate-extract registry-extract
            registry_url="$(npm view "@moewolf/moe-icons-cli@${version}" dist.tarball)"
            [[ "$registry_url" == https://registry.npmjs.org/* ]] || { echo "unexpected registry tarball URL" >&2; exit 1; }
            if [ -f scripts/metered-curl.cjs ]; then
              node scripts/metered-curl.cjs --url "$registry_url" --output registry/package.tgz --transport-report "$RUNNER_TEMP/cli-registry-transport.json"
            else
              # Older resume candidates predate the metered wrapper.
              curl --fail --location --proto '=https' --proto-redir '=https' "$registry_url" --output registry/package.tgz
            fi
            tar -xzf "$tgz" -C candidate-extract
            tar -xzf registry/*.tgz -C registry-extract
            (cd candidate-extract && find . -type f | sort | xargs shasum -a 256) > candidate-digests
            (cd registry-extract && find . -type f | sort | xargs shasum -a 256) > registry-digests
            diff -u candidate-digests registry-digests || { echo "registry content differs from candidate" >&2; exit 1; }
            integrity="$(npm view "@moewolf/moe-icons-cli@${version}" dist.integrity)"
            echo "registry integrity: $integrity"
          else
            npm --version
            npm publish "$tgz" --access public --provenance --loglevel verbose
          fi
      # Recovery stage 2: the publish command returned successfully. This must
      # not depend on the registry read path: npm can accept a version while its
      # read path still answers ETARGET/E404 for a while.
      - name: Record the publish command result
        env:
          RELEASE_TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p accepted
          node -e '
            const fs=require("fs");
            const accepted={schemaVersion:1,version:process.argv[1],tag:process.env.RELEASE_TAG,
              repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,
              runAttempt:process.env.GITHUB_RUN_ATTEMPT,stage:"publish-command-succeeded",
              recordedAt:new Date().toISOString()};
            fs.writeFileSync("accepted/cli-registry-accepted.json", JSON.stringify(accepted,null,2)+"\n");
          ' "$version"
          cat accepted/cli-registry-accepted.json
      - name: Upload the publish command result before any registry read
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-registry-command-succeeded-${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          path: accepted/cli-registry-accepted.json
          if-no-files-found: error
          retention-days: 30
      # Recovery stage 3: read the published integrity back with a bounded retry
      # (ETARGET/E404/5xx are propagation states, not authorization failures).
      - name: Read the published integrity with a bounded retry
        env:
          RELEASE_TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          integrity=""
          for attempt in $(seq 1 40); do
            integrity="$(npm view "@moewolf/moe-icons-cli@${version}" dist.integrity 2>/dev/null || true)"
            if [[ "$integrity" =~ ^sha512- ]]; then break; fi
            echo "registry integrity not visible yet (attempt ${attempt}/40)" >&2
            sleep 20
          done
          if [[ ! "$integrity" =~ ^sha512- ]]; then
            echo "published version $version never became readable with an integrity" >&2
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const file="accepted/cli-registry-accepted.json";
            const accepted=JSON.parse(fs.readFileSync(file,"utf8"));
            accepted.npmIntegrity=process.argv[1];
            accepted.stage="registry-accepted";
            accepted.acceptedAt=new Date().toISOString();
            fs.writeFileSync(file, JSON.stringify(accepted,null,2)+"\n");
          ' "$integrity"
          cat accepted/cli-registry-accepted.json
      - name: Upload registry-accepted evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-registry-accepted-${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          path: accepted/cli-registry-accepted.json
          if-no-files-found: error
          retention-days: 14
      - name: Wait for public registry visibility and smoke npx install
        timeout-minutes: 35
        env:
          RELEASE_TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          unset NODE_AUTH_TOKEN
          export NPM_CONFIG_USERCONFIG=/dev/null
          node scripts/wait-for-registry-package.mjs "@moewolf/moe-icons-cli" "$version"
      - name: Finalize the Release
        env:
          # Publishing a release whose target commit changes workflow files
          # requires a token with Workflows: write. Reuse the same narrowly
          # scoped override used to create the frozen tag and draft release.
          GH_TOKEN: ${{ secrets.CLI_RELEASE_WRITE_TOKEN || github.token }}
          TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json isDraft,tagName,url
      - name: Verify the staged recovery evidence matches this receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.recover.outputs.candidate_sha || needs.pack.outputs.candidate_sha }}
          PIN_COMMIT: ${{ needs.recover.outputs.pin_commit || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence/intent evidence/accepted
          gh run download "$GITHUB_RUN_ID" --pattern 'cli-publish-intent-*' --dir evidence/intent || true
          gh run download "$GITHUB_RUN_ID" --pattern 'cli-registry-accepted-*' --dir evidence/accepted || true
          intent="$(find evidence/intent -name cli-publish-intent.json -print -quit)"
          accepted="$(find evidence/accepted -name cli-registry-accepted.json -print -quit)"
          test -f "$intent"
          test -f "$accepted"
          node scripts/verify-publish-evidence.mjs \
            --intent "$intent" --accepted "$accepted" \
            --tag "$RELEASE_TAG" --candidate "$CANDIDATE_SHA" --pin "$PIN_COMMIT" --require-accepted
      # P1-1: emit a canonical publish receipt so the code-library coordinator
      # verifies the real release (never the run title).
      - name: Write the canonical publish receipt
        env:
          TAG: ${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.recover.outputs.candidate_sha || needs.pack.outputs.candidate_sha }}
          RELEASE_COMMIT: ${{ needs.recover.outputs.cli_commit || needs.pack.outputs.cli_commit }}
          PIN_COMMIT: ${{ needs.recover.outputs.pin_commit || github.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          integrity="$(npm view "@moewolf/moe-icons-cli@${version}" dist.integrity)"
          [[ "$integrity" =~ ^sha512- ]] || { echo "missing npm integrity" >&2; exit 1; }
          if [ -f scripts/metered-curl.cjs ]; then
            node scripts/metered-curl.cjs --url "https://registry.npmjs.org/-/npm/v1/attestations/@moewolf/moe-icons-cli@${version}" --header 'Accept: application/json' --output "$RUNNER_TEMP/cli-attestations.json" --scope cli-registry-attestation --transport-report "$RUNNER_TEMP/cli-attestation-transport.json"
            prov="$(cat "$RUNNER_TEMP/cli-attestations.json")"
          else
            prov="$(curl -fsSL -H 'Accept: application/json' "https://registry.npmjs.org/-/npm/v1/attestations/@moewolf/moe-icons-cli@${version}")"
          fi
          node -e 'const a=JSON.parse(process.argv[1]);if(!Array.isArray(a.attestations)||a.attestations.length===0){console.error("missing provenance attestations");process.exit(1);}' "$prov"
          mkdir -p receipt
          node -e '
            const fs=require("fs");
            const receipt={
              schemaVersion:1,
              pinCommit:process.env.PIN_COMMIT,
              releaseCommit:process.env.RELEASE_COMMIT,
              version:process.argv[1],
              tag:process.env.TAG,
              tgzSha256:process.env.EXPECTED_SHA,
              npmIntegrity:process.argv[2],
              provenance:true,
              repository:process.env.GITHUB_REPOSITORY,
              workflowPath:".github/workflows/publish.yml",
              runId:process.env.GITHUB_RUN_ID,
              runAttempt:process.env.GITHUB_RUN_ATTEMPT,
              conclusion:"success",
            };
            fs.writeFileSync("receipt/cli-publish-receipt.json", JSON.stringify(receipt,null,2)+"\n");
          ' "$version" "$integrity"
      - name: Upload the publish receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-publish-receipt-${{ needs.recover.outputs.release_tag || needs.pack.outputs.release_tag }}
          path: receipt/cli-publish-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve immutable public publish receipt for downstream replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/persist-publish-receipt.mjs

  reused-receipt:
    # The pin can point at a commit whose exact payload is already released
    # (a bot release commit or an unchanged payload). The Generator coordinator
    # still needs a canonical publish receipt for the event, so emit one that
    # binds the already published version instead of silently publishing
    # nothing.
    needs: decide
    if: always() && needs.decide.result == 'success' && needs.decide.outputs.should_release == '0' && github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Write the reused publish receipt for the already released payload
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_HASH: ${{ needs.decide.outputs.payload_hash }}
        run: |
          set -euo pipefail
          [[ "$PAYLOAD_HASH" =~ ^[a-f0-9]{64}$ ]]
          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${TAG#v}"
          export TAG
          # A reused receipt may only describe THIS candidate: "the latest release"
          # is not "the release that matches this payload".
          RELEASE_PAYLOAD="$(gh release view "$TAG" --json body --jq .body | grep -o 'payloadHash: [a-f0-9]*' | awk '{print $2}')"
          if [ "$RELEASE_PAYLOAD" != "$PAYLOAD_HASH" ]; then
            echo "latest release $TAG belongs to another candidate (payload ${RELEASE_PAYLOAD:-none} != $PAYLOAD_HASH); refusing a reused receipt" >&2
            exit 1
          fi
          RELEASE_COMMIT="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          current_resource="$(gh api "repos/$GITHUB_REPOSITORY/contents/src/catalog/resource-release.json?ref=$GITHUB_SHA" --jq .content)"
          release_resource="$(gh api "repos/$GITHUB_REPOSITORY/contents/src/catalog/resource-release.json?ref=$RELEASE_COMMIT" --jq .content)"
          if [ "$current_resource" != "$release_resource" ]; then
            echo "released resource identity at $RELEASE_COMMIT differs from this candidate; refusing a reused receipt" >&2
            exit 1
          fi
          DIGEST="$(gh release view "$TAG" --json assets --jq '.assets[]|select(.name|endswith(".tgz"))|.digest' | head -1)"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          TGZ_SHA="${DIGEST#sha256:}"
          mkdir -p "$RUNNER_TEMP/release-tarball"
          gh release download "$TAG" --pattern '*.tgz' --dir "$RUNNER_TEMP/release-tarball"
          tgz="$(find "$RUNNER_TEMP/release-tarball" -name '*.tgz' -print -quit)"
          test -f "$tgz"
          INTEGRITY="$(npm view "@moewolf/moe-icons-cli@${VERSION}" dist.integrity)"
          [[ "$INTEGRITY" =~ ^sha512- ]]
          TARBALL_INTEGRITY="$(node -e 'const c=require("node:crypto"),fs=require("node:fs");process.stdout.write("sha512-"+c.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tgz")"
          if [ "$TARBALL_INTEGRITY" != "$INTEGRITY" ]; then
            echo "release tarball integrity differs from the npm package; refusing a reused receipt" >&2
            exit 1
          fi
          ATTESTATIONS="$(curl -fsSL -H 'Accept: application/json' "https://registry.npmjs.org/-/npm/v1/attestations/@moewolf/moe-icons-cli@${VERSION}")"
          node -e 'const a=JSON.parse(process.argv[1]);if(!Array.isArray(a.attestations)||a.attestations.length===0){console.error("missing provenance attestations");process.exit(1);}' "$ATTESTATIONS"
          mkdir -p receipt
          node -e '
            const fs=require("fs");
            const receipt={schemaVersion:1,pinCommit:process.env.GITHUB_SHA,releaseCommit:process.argv[2],
              version:process.argv[1],tag:process.env.TAG,tgzSha256:process.argv[3],npmIntegrity:process.argv[4],
              provenance:true,repository:process.env.GITHUB_REPOSITORY,workflowPath:".github/workflows/publish.yml",
              runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,conclusion:"success"};
            fs.writeFileSync("receipt/cli-publish-receipt.json", JSON.stringify(receipt,null,2)+"\n");
          ' "$VERSION" "$RELEASE_COMMIT" "$TGZ_SHA" "$INTEGRITY"
          cat receipt/cli-publish-receipt.json
      - name: Upload the reused publish receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-publish-receipt-${{ github.sha }}
          path: receipt/cli-publish-receipt.json
          if-no-files-found: error
          retention-days: 14
