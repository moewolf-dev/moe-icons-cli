name: Recover accepted CLI 0.0.3 tag once
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: moewolf-dev/moe-icons-cli
          ref: d4bb1db785fcab05f3bb3bab929b7143d79ee591
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the already accepted immutable candidate and create only its missing exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/moewolf-dev/moe-icons-cli/actions/variables/MOEICONS_AUTO_RELEASE_ENABLED --jq .value)" = true
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import fs from 'node:fs';import {join} from 'node:path';import {createHash} from 'node:crypto';import {execFileSync} from 'node:child_process';
          import {verifyRecoveryIdentity} from './scripts/recover-candidate.mjs';import {ensureReleaseTag} from './scripts/ensure-release-tag.mjs';
          const repo='moewolf-dev/moe-icons-cli',runId='37189378478',artifactId='11298159309',commit='d3c51380e28c1915b47eb316024ec9373b22cec7',pin='6131bde87bd8d97156d76b330a79270400f5caf6',expected='f6978468e78afd799480f3e24769fe319341910b93a557ab00684266e78607aa';
          const api=p=>JSON.parse(execFileSync('gh',['api',`repos/${repo}/${p}`],{encoding:'utf8',maxBuffer:8*1024*1024}));
          const run=api(`actions/runs/${runId}`),jobs=api(`actions/runs/${runId}/jobs?filter=all&per_page=100`),metadata=api(`actions/artifacts/${artifactId}`);
          assert.equal(run.run_attempt,2);assert.equal(run.head_sha,pin);assert.equal(metadata.expired,false);assert.equal(metadata.workflow_run.id,Number(runId));assert.equal(metadata.workflow_run.head_sha,pin);assert.equal(metadata.size_in_bytes,267806);assert.equal(metadata.digest,'sha256:ca08dc2c11326b30576c9e1b60e89bb528566a39058f295316d3cb42bd52a2b5');
          const temp=fs.mkdtempSync(join(process.env.RUNNER_TEMP,'cli-accepted-tag-'));
          try {
            const zip=join(temp,'candidate.zip');fs.writeFileSync(zip,execFileSync('gh',['api',`repos/${repo}/actions/artifacts/${artifactId}/zip`],{maxBuffer:1024*1024}));
            assert.equal(fs.statSync(zip).size,metadata.size_in_bytes);assert.equal('sha256:'+createHash('sha256').update(fs.readFileSync(zip)).digest('hex'),metadata.digest);
            const names=execFileSync('unzip',['-Z1',zip],{encoding:'utf8'}).trim().split(/\r?\n/);assert.equal(new Set(names).size,names.length);assert.ok(names.every(n=>!n.includes('/')&&!n.includes('\\')));
            const manifest=JSON.parse(execFileSync('unzip',['-p',zip,'candidate-manifest.json'],{encoding:'utf8'}));
            const tgz=join(temp,'candidate.tgz'),bytes=execFileSync('unzip',['-p',zip,'moewolf-moe-icons-cli-0.0.3.tgz'],{maxBuffer:1024*1024});fs.writeFileSync(tgz,bytes);const sha=createHash('sha256').update(bytes).digest('hex');assert.equal(sha,expected);
            const pkg=JSON.parse(execFileSync('tar',['-xOzf',tgz,'package/package.json'],{encoding:'utf8'}));
            const identity=verifyRecoveryIdentity({run,jobs,pkg,manifest,sha,repository:repo,runId});
            const acceptance=execFileSync('gh',['run','view',runId,'--repo',repo,'--job',String(identity.acceptanceJob),'--log'],{encoding:'utf8',maxBuffer:16*1024*1024});assert.ok(acceptance.includes(`candidate_sha=${sha}`));
            const source=api(`contents/package.json?ref=${commit}`);assert.deepEqual(JSON.parse(Buffer.from(source.content,'base64').toString('utf8')),pkg);
            const gitCommit=api(`commits/${commit}`);assert.equal(gitCommit.parents[0].sha,pin);assert.ok(gitCommit.commit.message.includes('cli v0.0.3 [source 6131bde]'));
            const draft=JSON.parse(execFileSync('gh',['release','view','v0.0.3','--repo',repo,'--json','isDraft,targetCommitish,body,assets'],{encoding:'utf8'}));assert.equal(draft.isDraft,true);assert.equal(draft.targetCommitish,commit);assert.ok(draft.body.includes(`sha256: ${sha}`)&&draft.body.includes(`payloadHash: ${pkg.payloadHash}`));assert.equal(draft.assets.length,0);
            const proof=await ensureReleaseTag({tag:'v0.0.3',commit,token:process.env.RELEASE_WRITE_TOKEN});fs.mkdirSync('tag-proof');fs.writeFileSync('tag-proof/accepted-cli-tag.json',JSON.stringify({...proof,publisherRunId:runId,acceptanceJobId:identity.acceptanceJob,candidateArtifactId:artifactId,tarballSha256:sha,candidateRepacked:false},null,2)+'\n');console.log(JSON.stringify(proof));
          } finally {fs.rmSync(temp,{recursive:true,force:true});}
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accepted-cli-tag-${{ github.run_id }}
          path: tag-proof/accepted-cli-tag.json
          if-no-files-found: error
          retention-days: 14
