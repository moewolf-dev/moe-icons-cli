name: Platform smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  packed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Version and JSON contract
        env:
          MOEICONS_CACHE_DIR: ${{ runner.temp }}/moeicons-cache
        run: |
          node bin/moeicons.js --version
          node bin/moeicons.js --json --version
          node bin/moeicons.js doctor --export-diagnostics --json
