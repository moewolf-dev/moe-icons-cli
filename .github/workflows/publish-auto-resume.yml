name: Auto resume transient CLI publication

on:
  workflow_run:
    workflows: [Publish CLI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: cli-publish-auto-resume-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.repository == 'moewolf-dev/moe-icons-cli' && github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, Linux, X64, moe-ci-server]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # Full checkout: this job also needs .github/scripts (runner bootstrap) and
      # the resume scripts. A sparse checkout here previously left the shared
      # runner workspace without those files and poisoned every later job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Resume the exact accepted candidate after visibility or finalization failure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/auto-resume-publish.mjs
