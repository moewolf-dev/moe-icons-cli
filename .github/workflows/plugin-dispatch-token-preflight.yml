name: Plugin dispatch token preflight (non-publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, moe-ci-server]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Repair a missing-file workspace
        # The shared runner workspace can report the exact SHA while tracked
        # files are absent. Detect a missing tracked file and rebuild the index
        # and working tree from HEAD. Nothing closes the listing pipe early, so
        # `pipefail` cannot turn the probe into SIGPIPE noise.
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$missing" = 1 ]; then
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - name: Verify PLUGIN_DISPATCH_TOKEN against an unhandled probe event
        env:
          PLUGIN_DISPATCH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/preflight-plugin-dispatch-token.mjs
