name: Plugin dispatch token preflight (non-publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, moe-ci-server]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Repair a workspace left in sparse-checkout mode
        # A failed sparse-checkout job can leave skip-worktree index entries, so
        # actions/checkout reports the exact SHA while files are absent. Clear the
        # bits and re-materialise the tracked tree before any script reads it.
        run: |
          set -euo pipefail
          skipped="$(git ls-files -v | sed -n 's/^S //p')"
          if [ -n "$skipped" ]; then
            printf '%s\n' "$skipped" | while IFS= read -r path; do
              git update-index --no-skip-worktree -- "$path"
            done
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - name: Verify PLUGIN_DISPATCH_TOKEN against an unhandled probe event
        env:
          PLUGIN_DISPATCH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/preflight-plugin-dispatch-token.mjs
