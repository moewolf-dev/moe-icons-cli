name: Plugin dispatch token preflight (non-publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, moe-ci-server]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - name: Verify PLUGIN_DISPATCH_TOKEN against an unhandled probe event
        env:
          PLUGIN_DISPATCH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/preflight-plugin-dispatch-token.mjs
