name: Plugin dispatch token preflight (non-publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, moe-ci-server]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Repair a missing-file workspace
        # A sparse-checkout or index-bit job on the shared runner can leave the
        # tree reporting the exact SHA while tracked files are absent. Detect a
        # missing tracked file and rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          missing="$(git ls-files -z | tr '\0' '\n' | while IFS= read -r path; do [ -e "$path" ] || echo "$path"; done | head -n 1)"
          if [ -n "$missing" ]; then
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - name: Verify PLUGIN_DISPATCH_TOKEN against an unhandled probe event
        env:
          PLUGIN_DISPATCH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/preflight-plugin-dispatch-token.mjs
