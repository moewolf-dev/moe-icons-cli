name: CLI package candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MOEICONS_PACKAGE_MAKER_REPO: ${{ github.workspace }}/moe-icons-package-maker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout shared contract fixture authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: moewolf-dev/moe-icons-package-maker
          path: moe-icons-package-maker
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # AUD-BLOCK-02: prove the vendored contract matches the pinned public commit.
      - run: npm run policy:verify-remote
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Pack immutable candidate
        id: pack
        shell: bash
        run: |
          mkdir -p .artifacts
          npm pack --json --pack-destination .artifacts > .artifacts/npm-pack.json
          TGZ="$(node -e "const p=require('./.artifacts/npm-pack.json');process.stdout.write(p[0].filename)")"
          SHA="$(shasum -a 256 ".artifacts/$TGZ" | cut -d ' ' -f 1)"
          VERSION="$(node -p "require('./package.json').version")"
          node -e "const fs=require('fs');fs.writeFileSync('.artifacts/candidate.json',JSON.stringify({schemaVersion:1,commit:process.env.GITHUB_SHA,version:process.argv[1],tarball:process.argv[2],sha256:process.argv[3]},null,2)+'\n')" "$VERSION" "$TGZ" "$SHA"
          test -f ".artifacts/$TGZ"
          test -f .artifacts/candidate.json
          test -f .artifacts/npm-pack.json
          echo "tarball=$TGZ" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moeicons-cli-${{ github.sha }}
          path: |
            .artifacts/*.tgz
            .artifacts/candidate.json
            .artifacts/npm-pack.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
