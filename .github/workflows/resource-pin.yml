name: Update CLI resource pin

# E2E-G1A: consume verified moe-icons-code-library-release, refresh bundled
# catalog + resource-release.json, patch-bump CLI version, and (only when
# MOEICONS_AUTO_RELEASE_ENABLED=true) push the bot commit that later triggers
# Publish CLI. workflow_dispatch is dry-run only.

run-name: CLI package-set resource ${{ github.event.client_payload.eventId || github.event.client_payload.correlationId || inputs.correlationId || github.sha }}

on:
  repository_dispatch:
    types: [moe-icons-code-library-release, moe-icons-package-set-release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: dry_run=true forces zero git writes
        required: false
        default: "true"
        type: string
      correlationId:
        required: false
        type: string
      resourceVersion:
        required: false
        type: string
      sourceCommit:
        required: false
        type: string
      generatorCommit:
        required: false
        type: string
      privateDescriptorSha256:
        required: false
        type: string
      publicDescriptorSha256:
        required: false
        type: string
      freeCandidateArtifactId:
        required: false
        type: string
      upstreamRunId:
        required: false
        type: string

permissions: {}

concurrency:
  group: cli-auto-release
  cancel-in-progress: false
  queue: max

jobs:
  small-pack-policy:
    if: github.event.action != 'moe-icons-package-set-release'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Block the legacy whole-library pin update before artifact download
        run: |
          echo "::error::CLI pin updates are paused until candidate-set metadata packages are supported."
          exit 78

  package-set-pin:
    if: github.repository == 'moewolf-dev/moe-icons-cli' && github.event_name == 'repository_dispatch' && github.event.action == 'moe-icons-package-set-release' && vars.MOEICONS_AUTO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Verify exact Source/Generator producer and package-set roots
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN || secrets.CODE_LIBRARY_READ_TOKEN }}
          EVENT_ID: ${{ github.event.client_payload.eventId }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Configure CODE_LIBRARY_ARTIFACT_READ_TOKEN with private code-library Actions read access'; exit 1; }
          echo "::add-mask::$GH_TOKEN"
          root="$RUNNER_TEMP/moe-cli-package-set-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PACKAGE_SET_ROOT=$root" >> "$GITHUB_ENV"
          node scripts/verify-package-set-input.mjs "$root"

      - name: Read only exact Free/Pro metadata packages from Worker
        env:
          PRO_PACKAGE_SET_WORKFLOW_TOKEN: ${{ secrets.PRO_PACKAGE_SET_WORKFLOW_TOKEN }}
          MOEICONS_API_BASE_URL: https://api.moeicons.com
        run: |
          set -euo pipefail
          test -n "$PRO_PACKAGE_SET_WORKFLOW_TOKEN" || { echo 'Configure PRO_PACKAGE_SET_WORKFLOW_TOKEN for authenticated Pro package-set reads'; exit 1; }
          echo "::add-mask::$PRO_PACKAGE_SET_WORKFLOW_TOKEN"
          node scripts/package-set-catalog.mjs "$PACKAGE_SET_ROOT/package-set-binding.json" "$RUNNER_TEMP/package-set-catalog.json"
          catalog_sha="$(shasum -a 256 "$RUNNER_TEMP/package-set-catalog.json" | awk '{print $1}')"
          echo "PACKAGE_SET_CATALOG_SHA=$catalog_sha" >> "$GITHUB_ENV"

      - name: Validate and apply the exact package-set pin
        id: apply
        run: |
          set -euo pipefail
          node scripts/apply-package-set-pin.mjs \
            --event "$PACKAGE_SET_ROOT/event.json" \
            --catalog "$RUNNER_TEMP/package-set-catalog.json" \
            --catalog-sha256 "$PACKAGE_SET_CATALOG_SHA" \
            | tee "$RUNNER_TEMP/package-set-pin-apply.json"
          echo "action=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).action' "$RUNNER_TEMP/package-set-pin-apply.json")" >> "$GITHUB_OUTPUT"

      - name: Test the new catalog and build the exact CLI release tree
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Commit or reuse the exact package-set pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "moe-icons-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog/catalog.json src/catalog/resource-release.json
          extra="$(git diff --cached --name-only | grep -vE '^(src/catalog/catalog\.json|src/catalog/resource-release\.json)$' || true)"
          test -z "$extra" || { echo "disallowed staged paths: $extra" >&2; exit 1; }
          if ! git diff --cached --quiet; then
            version="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).resourceVersion' "$PACKAGE_SET_ROOT/event.json")"
            git commit -m "chore(release): pin package-set resources $version"
            git push origin HEAD:main
          fi
          pushed="$(git rev-parse HEAD)"
          [[ "$pushed" =~ ^[0-9a-f]{40}$ ]]
          echo "pin_commit=$pushed" >> "$GITHUB_OUTPUT"

      - name: Write the verified package-set pin receipt
        env:
          PIN_COMMIT: ${{ steps.pin.outputs.pin_commit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-set-pin-receipt"
          node - "$PACKAGE_SET_ROOT/event.json" "$PIN_COMMIT" "$PACKAGE_SET_CATALOG_SHA" "$RUNNER_TEMP/package-set-pin-receipt/cli-package-set-pin-receipt.json" <<'NODE'
          const fs=require('node:fs');
          const event=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const receipt={schemaVersion:1,eventId:event.eventId,resourceVersion:event.resourceVersion,sourceCommit:event.sourceCommit,generatorCommit:event.generatorCommit,sourceDispatchId:event.sourceDispatchId,packageSets:event.packageSets,producer:event.producer,pinCommit:process.argv[3],catalogSha256:process.argv[4]};
          fs.writeFileSync(process.argv[5],JSON.stringify(receipt,null,2)+'\n',{flag:'wx',mode:0o600});
          NODE

      - name: Upload the exact package-set pin receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-package-set-pin-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-set-pin-receipt/cli-package-set-pin-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Dispatch the guarded OIDC publisher for the exact pushed pin
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_COMMIT: ${{ steps.pin.outputs.pin_commit }}
          EVENT_ID: ${{ github.event.client_payload.eventId }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$live" = "$PIN_COMMIT" || { echo 'main drifted after package-set pin; refusing publisher dispatch' >&2; exit 1; }
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f npm_auth_mode=oidc -f dry_run=false -f break_glass=PUBLISH -f correlation_id="$EVENT_ID"

  pin:
    # Retired pin flow downloads the aggregate code-library ZIP for catalog
    # metadata. Keep it disabled independently of the policy job.
    if: false
    needs: [small-pack-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Reject workflow_dispatch writes
        id: dispatchcheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            echo "workflow_dispatch is reserved for dry_run=true" >&2
            exit 1
          fi
          echo "write_allowed=1" >> "$GITHUB_OUTPUT"

      - name: Check auto-release switch (F6)
        id: switch
        env:
          MOEICONS_AUTO_RELEASE_ENABLED: ${{ vars.MOEICONS_AUTO_RELEASE_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          elif [ "$MOEICONS_AUTO_RELEASE_ENABLED" != "true" ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize event payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          OUT: ${{ runner.temp }}/cli-pin-event.json
          RESOURCE_VERSION: ${{ inputs.resourceVersion }}
          SOURCE_COMMIT: ${{ inputs.sourceCommit }}
          GENERATOR_COMMIT: ${{ inputs.generatorCommit }}
          PRIVATE_SHA: ${{ inputs.privateDescriptorSha256 }}
          PUBLIC_SHA: ${{ inputs.publicDescriptorSha256 }}
          ARTIFACT_ID: ${{ inputs.freeCandidateArtifactId }}
          UPSTREAM_RUN_ID: ${{ inputs.upstreamRunId }}
          CORRELATION_ID: ${{ inputs.correlationId }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            node -e '
              const fs=require("fs");
              const p=JSON.parse(process.env.PAYLOAD);
              fs.writeFileSync(process.env.OUT, JSON.stringify(p,null,2)+"\n");
            '
          else
            node -e '
              const fs=require("fs");
              const p={
                resourceVersion: process.env.RESOURCE_VERSION,
                sourceCommit: process.env.SOURCE_COMMIT,
                generatorCommit: process.env.GENERATOR_COMMIT,
                privateDescriptorSha256: process.env.PRIVATE_SHA,
                publicDescriptorSha256: process.env.PUBLIC_SHA,
                freeCandidateArtifactId: process.env.ARTIFACT_ID,
                upstreamRunId: process.env.UPSTREAM_RUN_ID,
                correlationId: process.env.CORRELATION_ID || null,
              };
              fs.writeFileSync(process.env.OUT, JSON.stringify(p,null,2)+"\n");
            '
          fi

      - name: Validate event
        run: node scripts/validate-code-library-event.mjs "$RUNNER_TEMP/cli-pin-event.json" | tee "$RUNNER_TEMP/cli-pin-event.validated.json"

      - name: Download free-candidate artifact (catalog source)
        if: ${{ github.event_name == 'repository_dispatch' || inputs.freeCandidateArtifactId != '' }}
        env:
          GH_TOKEN: ${{ secrets.CODE_LIBRARY_ARTIFACT_READ_TOKEN || secrets.CODE_LIBRARY_READ_TOKEN }}
          ARTIFACT_ID: ${{ github.event.client_payload.artifact.candidateArtifactId || github.event.client_payload.freeCandidateArtifactId || github.event.client_payload.artifactId || inputs.freeCandidateArtifactId }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          echo "::add-mask::$GH_TOKEN"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/candidate"
          node - "$RUNNER_TEMP/cli-pin-event.validated.json" "$RUNNER_TEMP" <<'NODE'
          const fs=require('node:fs'),p=require('node:path'),{retrieve}=require('./scripts/durable-release-artifact.cjs');
          const e=JSON.parse(fs.readFileSync(process.argv[2])),root=process.argv[3];
          retrieve({id:process.env.ARTIFACT_ID,version:e.resourceVersion,runId:e.upstreamRunId,headSha:e.generatorCommit},p.join(root,'candidate.zip')).then(meta=>fs.writeFileSync(p.join(root,'candidate-artifact.json'),JSON.stringify(meta))).catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
          python3 scripts/unpack-release-artifact.py "$RUNNER_TEMP/candidate.zip" "$RUNNER_TEMP/candidate"
          node scripts/verify-pin-candidate.mjs "$RUNNER_TEMP/cli-pin-event.validated.json" \
            "$RUNNER_TEMP/candidate-artifact.json" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/catalog.json" \
            > "$RUNNER_TEMP/catalog-proof.json"
          echo "catalog_sha=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).catalogSha256' "$RUNNER_TEMP/catalog-proof.json")" >> "$GITHUB_OUTPUT"
        id: catalog

      - name: Fixture catalog for dry-run without artifact
        id: fixturecatalog
        if: ${{ steps.catalog.outcome == 'skipped' || steps.catalog.outputs.catalog_sha == '' }}
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const event=JSON.parse(fs.readFileSync(process.env.EVENT,"utf8"));
            const catalog=JSON.parse(fs.readFileSync("src/catalog/catalog.json","utf8"));
            catalog.catalogVersion=event.resourceVersion;
            catalog.sourceVersion=event.resourceVersion;
            catalog.sourceCommit=event.sourceCommit;
            catalog.generatorCommit=event.generatorCommit;
            fs.writeFileSync(process.env.OUT, JSON.stringify(catalog,null,2)+"\n");
          '
          echo "catalog_sha=$(shasum -a 256 "$RUNNER_TEMP/catalog.json" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ runner.temp }}/cli-pin-event.validated.json
          OUT: ${{ runner.temp }}/catalog.json

      - name: Apply resource pin (dry-run when switch blocked)
        id: apply
        run: |
          set -euo pipefail
          EXTRA=(--dry-run)
          if [ "${{ steps.switch.outputs.blocked }}" = "0" ] && [ "${{ steps.dispatchcheck.outputs.write_allowed }}" = "1" ]; then
            EXTRA=()
          fi
          node scripts/apply-resource-pin.mjs \
            --event "$RUNNER_TEMP/cli-pin-event.validated.json" \
            --catalog "$RUNNER_TEMP/catalog.json" \
            --catalog-sha256 "${{ steps.catalog.outputs.catalog_sha || steps.fixturecatalog.outputs.catalog_sha }}" \
            "${EXTRA[@]}" | tee "$RUNNER_TEMP/pin-apply.json"
          echo "action=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).action)" "$RUNNER_TEMP/pin-apply.json")" >> "$GITHUB_OUTPUT"

      - name: Plan and optionally commit pin bump
        if: steps.apply.outputs.action == 'apply' && steps.switch.outputs.blocked == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).resourceVersion)" "$RUNNER_TEMP/cli-pin-event.validated.json")"
          node scripts/plan-resource-pin-commit.mjs --resource-version "$VERSION" > "$RUNNER_TEMP/pin-commit.json"
          MSG="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1])).commitMessage)" "$RUNNER_TEMP/pin-commit.json")"
          # CLI-version-owner: pin only updates the resource files; the patch
          # bump happens exactly once in the explicitly dispatched Publish CLI. Staging package.json here caused a double increment.
          git config user.name "moe-icons-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog/catalog.json src/catalog/resource-release.json
          EXTRA="$(git diff --cached --name-only | grep -vE '^(src/catalog/catalog\.json|src/catalog/resource-release\.json)$' || true)"
          if [ -n "$EXTRA" ]; then
            echo "disallowed staged paths:" >&2
            echo "$EXTRA" >&2
            exit 1
          fi
          git commit -m "$MSG"
          git push origin HEAD:main

      - name: Write the pin receipt
        if: (steps.apply.outputs.action == 'apply' || steps.apply.outputs.action == 'skip') && steps.switch.outputs.blocked == '0' && steps.dispatchcheck.outputs.write_allowed == '1' && github.event_name == 'repository_dispatch'
        env:
          VERSION: ${{ github.event.client_payload.resourceVersion || inputs.resourceVersion }}
          PIN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A validated identical pin has no new commit; HEAD remains the exact
          # current source. For a new pin, HEAD follows its commit (github.sha is
          # the pre-pin commit); record it so the coordinator can bind the exact
          # Publish CLI run by head SHA instead of a time window.
          PUSHED="$(git rev-parse HEAD)"
          [[ "$PUSHED" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/pin-receipt"
          node -e '
            const fs=require("fs");
            const receipt={schemaVersion:1,pinCommit:process.argv[1],resourceVersion:process.argv[2]};
            fs.writeFileSync(process.argv[3]+"/cli-pin-receipt.json", JSON.stringify(receipt,null,2)+"\n");
          ' "$PUSHED" "$VERSION" "$RUNNER_TEMP/pin-receipt"

      - name: Upload the pin receipt
        if: (steps.apply.outputs.action == 'apply' || steps.apply.outputs.action == 'skip') && steps.switch.outputs.blocked == '0' && steps.dispatchcheck.outputs.write_allowed == '1' && github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-resource-pin-receipt-${{ github.event.client_payload.resourceVersion || inputs.resourceVersion }}
          path: ${{ runner.temp }}/pin-receipt/cli-pin-receipt.json
          if-no-files-found: error
          retention-days: 14

      # A GITHUB_TOKEN push cannot trigger a push workflow. Dispatch the existing
      # guarded OIDC publisher after the pin receipt exists; do not wait here,
      # because both workflows share cli-auto-release concurrency.
      - name: Dispatch guarded OIDC publisher for the exact pushed pin
        if: (steps.apply.outputs.action == 'apply' || steps.apply.outputs.action == 'skip') && steps.switch.outputs.blocked == '0' && steps.dispatchcheck.outputs.write_allowed == '1' && github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pushed="$(git rev-parse HEAD)"
          live="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$live" = "$pushed" || { echo "main drifted after resource pin; refusing publisher dispatch" >&2; exit 1; }
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f npm_auth_mode=oidc -f dry_run=false -f break_glass=PUBLISH

      - name: Dry-run / blocked conclusion
        if: steps.switch.outputs.blocked == '1'
        run: |
          echo "MOEICONS_AUTO_RELEASE_ENABLED is not true (or workflow_dispatch dry-run): validated pin plan, no git push."
          test -f "$RUNNER_TEMP/pin-apply.json"

      - name: Notify unique auto-release failure (F6)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_VERSION: ${{ github.event.client_payload.resourceVersion || inputs.resourceVersion }}
          CORRELATION_ID: ${{ github.event.client_payload.correlationId || inputs.correlationId }}
        run: |
          set -euo pipefail
          CID="${CORRELATION_ID:-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cli-pin}"
          node scripts/notify-release-failure.cjs --execute \
            --repo "${GITHUB_REPOSITORY}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --stage "cli-resource-pin" \
            --resource-version "${RESOURCE_VERSION:-n/a}" \
            --correlation-id "$CID" \
            --attempt "${GITHUB_RUN_ATTEMPT}" \
            --conclusion "failure"
