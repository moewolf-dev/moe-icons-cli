name: Notify plugin after CLI publication
run-name: Notify plugin after CLI ${{ github.event.workflow_run.id || inputs.publish_run_id }}
on:
  workflow_run:
    workflows: [Publish CLI]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful canonical publish run to replay without republishing CLI
        required: true
        type: string
      published_version:
        description: Optional exact CLI version for durable Release receipt replay after Actions expiry
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cli-plugin-notification-${{ github.event.workflow_run.id || inputs.publish_run_id }}
  cancel-in-progress: false
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ fromJSON(vars.SMALL_PACK_CLI_RUNNER || '["self-hosted","Linux","X64","moe-ci-server"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Repair a sparse or incomplete runner workspace
        # A job that sparse-checks out this repository leaves core.sparseCheckout
        # (and skip-worktree entries) in the shared runner workspace. Later jobs
        # then report the exact SHA while files are missing, and `git add` refuses
        # paths outside the sparse definition. Tear the sparse state down, then
        # rebuild the index and working tree from HEAD.
        run: |
          set -euo pipefail
          sparse=false
          if [ "$(git config --get core.sparseCheckout || true)" = true ]; then sparse=true; fi
          skipped="$(git ls-files -v | grep -c '^S ' || true)"
          missing=0
          while IFS= read -r -d '' path; do
            [ -e "$path" ] || { missing=1; break; }
          done < <(git ls-files -z)
          if [ "$sparse" = true ] || [ "${skipped:-0}" != 0 ] || [ "$missing" = 1 ]; then
            git config --local --unset-all core.sparseCheckout || true
            git config --local --unset-all extensions.worktreeConfig || true
            rm -f .git/info/sparse-checkout
            rm -f .git/index
            git reset -q
            git checkout-index -a -f
          fi
      - name: Prepare auxiliary runner tools
        run: bash .github/scripts/prepare-auxiliary-runner.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read completed publisher receipt and notify plugin
        id: notify
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_DISPATCH_TOKEN: ${{ secrets.PLUGIN_DISPATCH_TOKEN }}
          PUBLISHED_VERSION: ${{ inputs.published_version }}
          CLI_PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.publish_run_id }}
          # Stable inner filename: the Generator coordinator reads this exact
          # name from the correlated artifact (dispatch-small-package-cli.cjs).
          CLI_PLUGIN_VERIFICATION_RECEIPT: ${{ runner.temp }}/cli-plugin-verification.json
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-plugin-receipt"
          # A publisher run that reused an already released payload carries its
          # own canonical receipt artifact; only fall back to the release asset
          # when the run produced none (older publishes).
          if ! gh run download "$CLI_PUBLISH_RUN_ID" --repo moewolf-dev/moe-icons-cli --pattern 'cli-publish-receipt-*' --dir "$RUNNER_TEMP/cli-plugin-receipt" 2>/dev/null \
              || [ -z "$(find "$RUNNER_TEMP/cli-plugin-receipt" -name cli-publish-receipt.json -print -quit)" ]; then
            if [ -n "$PUBLISHED_VERSION" ]; then
              [[ "$PUBLISHED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              gh release download "v$PUBLISHED_VERSION" --repo moewolf-dev/moe-icons-cli --pattern cli-publish-receipt.json --dir "$RUNNER_TEMP/cli-plugin-receipt"
            fi
          fi
          receipt="$(find "$RUNNER_TEMP/cli-plugin-receipt" -name cli-publish-receipt.json -print -quit)"
          test -f "$receipt"
          published="$(gh api "repos/moewolf-dev/moe-icons-cli/actions/runs/$CLI_PUBLISH_RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name == "publish" and .conclusion == "success")] | length')"
          if [ "$published" != 1 ]; then
            receipt_run="$(node -e 'process.stdout.write(String(require(process.argv[1]).runId))' "$receipt")"
            receipt_version="$(node -e 'process.stdout.write(String(require(process.argv[1]).version))' "$receipt")"
            if [ "$receipt_run" != "$CLI_PUBLISH_RUN_ID" ]; then
              echo 'No completed publish job: dry-run/validate-only does not notify plugins'
              exit 0
            fi
            if [ -n "$PUBLISHED_VERSION" ] && [ "$receipt_version" != "$PUBLISHED_VERSION" ]; then
              echo 'Reused publish receipt version differs from the requested version'
              exit 1
            fi
            echo "Reused publish receipt for v$receipt_version: notifying plugins without a new publish job"
          fi
          node scripts/dispatch-plugin-release.mjs "$receipt"

      - name: Preserve verified package-set Marketplace receipt
        if: steps.notify.outputs.package_set_receipt == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-plugin-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cli-plugin-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
