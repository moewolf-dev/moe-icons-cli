name: Read npm submission lifecycle
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read lifecycle without resubmitting the package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          assert.match(process.env.VERSION,/^\d+\.\d+\.\d+$/);
          assert.ok(process.env.NODE_AUTH_TOKEN);
          const r=await fetch(`https://registry.npmjs.org/-/package/@moewolf%2fmoe-icons-cli/version/${process.env.VERSION}/status`,{headers:{Authorization:`Bearer ${process.env.NODE_AUTH_TOKEN}`},signal:AbortSignal.timeout(60000)});
          const j=r.ok?await r.json():{};
          const status=typeof j.status==='string'&&/^[a-z_-]{1,64}$/i.test(j.status)?j.status:null;
          const publicResponse=await fetch(`https://registry.npmjs.org/@moewolf%2fmoe-icons-cli/${process.env.VERSION}`,{signal:AbortSignal.timeout(60000)});
          console.log(JSON.stringify({version:process.env.VERSION,lifecycleHttp:r.status,lifecycle:status,publicRegistryHttp:publicResponse.status,productionWrites:false}));
          NODE
